# Time phrasing.
# Options: classic, shakespeare, klingon, belter, german, hal, cthulhu, latin
dialect: classic

# Font variant. For the full list and previews see docs/fonts.md. Grouped by
# the frame each one gets under `frame: auto`; "dejavu" is the default.
# Clean sans/serif/slab/mono & bold display (bauhaus frame):
#   alfa-slab-one, anton, arvo, balthazar, bangers, bitter, boogaloo, cabin,
#   cantarell, chango, charis-sil, comfortaa, courier-prime, crete-round, dejavu,
#   dejavu-serif, fira-mono, forum, fredoka, gravitas-one, jaro, jetbrains-mono,
#   josefin-slab, jost, liberation-serif, libertinus, lilita-one, literata,
#   luckiest-guy, modak, nunito, oswald, playfair, poppins, raleway, righteous,
#   roboto-slab, rokkitt, shrikhand, space-grotesk, staatliches, titan-one, ubuntu,
#   work-sans, zilla-slab
# Blackletter, medieval, horror & ornate (rustic frame):
#   almendra-display, astloch, butcherman, cinzel-decorative, creepster, eater,
#   emblema-one, flamenco, jolly-lodger, lacquer, manufacturing-consent,
#   medieval-sharp, nosifer, oi, pirata-one, rye, sancreek, smokum,
#   unifraktur-maguntia
# Hand-drawn, script & textured (sketchy frame):
#   akronim, amatic-sc, architects-daughter, caveat, clicker-script, dancing-script,
#   freckle-face, gloria-hallelujah, henny-penny, homemade-apple, indie-flower,
#   kablammo, kalam, lobster, pacifico, parisienne, patrick-hand, patrick-hand-sc,
#   permanent-marker, plaster, reenie-beanie, ribeye-marrow, rubik-beastly,
#   rubik-dirt, rubik-distressed, rubik-glitch, rubik-iso, rubik-maze, rubik-microbe,
#   rubik-puddles, rubik-spray-paint, rubik-wet-paint, shadows-into-light, shojumaru,
#   special-elite, splash, tangerine, unkempt, yellowtail
# Pixel, deco, techno & vintage display (retro frame):
#   abril-fatface, atomic-age, audiowide, baumans, bungee, bungee-shade, codystar,
#   diplomata, exo-2, fascinate, faster-one, foldit, iceland, limelight, megrim,
#   monoton, mystery-quest, nabla, orbitron, poiret-one, press-start-2p, rampart-one,
#   share-tech-mono, silkscreen, sixtyfour, syncopate, tourney, vt323, wallpoet,
#   workbench
# Commercial (drop a licensed file into fonts/ to unlock):
#   arno, bookerly, chaparral, livory, malabar, minion, pigeonette
# Special:
#   random (shuffle through every vendored variant before any repeats,
#           re-rolling on each phrase change)
font: dejavu

# Border frame style. "auto" picks one matched to the active font's category;
# explicit values override that pairing for any font.
# Options: auto (default), bauhaus, rustic, sketchy, retro
frame: auto

# Coordinates for after-hours mode (display inverts after sunset).
# Leave both null to disable; the clock will use plain day/night only.
latitude: 51.4769
longitude: 0.0005
