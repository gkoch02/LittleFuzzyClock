name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        # Config (line length, rule selection, exclusions) lives in pyproject.toml.
        run: ruff check .
      - name: Run ruff format --check
        # Enforces the canonical formatting; run `ruff format .` locally to fix.
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches Raspberry Pi OS Bookworm; 3.12 covers recent dev boxes.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install DejaVu fonts
        # fuzzyclock_core.load_font() looks for DejaVuSans-Bold.ttf first; the
        # rendering tests fail without it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Install Pillow and PyYAML
        # gpiozero / RPi.GPIO / spidev aren't installed: the daemon's hardware
        # imports are guarded so test_daemon* can import fuzzyclock_daemon
        # without them, and fuzzyclock_preview.py handles the missing-EPD case.
        run: pip install "Pillow>=10,<13" "PyYAML>=6,<7"

      - name: Run tests
        run: python -m unittest discover -v

  # Separate job, deliberately NOT a matrix dimension on `test` above: adding
  # one would rename those jobs to "test (3.11, <pillow>)", and
  # .github/rulesets/main.json requires the contexts "test (3.11)" and
  # "test (3.12)" by exact name. A required context that never reports blocks
  # every merge (see .github/rulesets/README.md), and bypass_actors is empty.
  test-pillow-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.11 matches Raspberry Pi OS Bookworm, the deployment target.
          python-version: "3.11"

      - name: Install DejaVu fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Install the oldest supported Pillow
        # The `test` jobs install "Pillow>=10,<13", which always resolves to the
        # newest release — so code using an API that only exists in the latest
        # Pillow passes CI and breaks anyone on an older one still allowed by
        # requirements.txt. This job pins that floor so the range is honest.
        #
        # An exact pin, not a range: pip resolves the NEWEST version satisfying
        # a specifier, so "Pillow>=10,<11" installs 10.4.0 and an API added in
        # 10.1-10.4 would still pass while breaking a user on 10.0.0 — which
        # requirements.txt permits. Keep this in step with that floor.
        run: pip install "Pillow==10.0.0" "PyYAML>=6,<7"

      - name: Show the resolved Pillow version
        # This job's whole value is testing a specific old Pillow, so state which
        # one it actually got rather than leaving it buried in pip's output.
        run: python -c "import PIL; print('Pillow', PIL.__version__)"

      - name: Run tests
        run: python -m unittest discover -v
